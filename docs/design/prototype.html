<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folio · 首版交互原型</title>
<link rel="stylesheet" href="prototype.css">
<body>
<aside class="guide">
  <div class="wordmark">folio<span>私 人 生 活 记 录</span></div>
  <p class="eyebrow">入口与找回 · 2026.11</p>
  <h1>把日子留下，<br>慢慢找回来。</h1>
  <p>从「随手记」留下一张照片或一句话。以后打开「记录」，接着写草稿，也可以按时间或地点找回。</p>
  <div class="guide-links" aria-label="样稿预览快捷入口">
    <button data-route="capture">01　随手记 <span>↗</span></button>
    <button data-route="home">02　记录与草稿 <span>↗</span></button>
    <button data-route="search">03　搜索全部记录 <span>↗</span></button>
    <button data-route="places">04　记录 · 按地点 <span>↗</span></button>
    <button data-route="trash">05　回收站 <span>↗</span></button>
  </div>
  <div class="prototype-note"><strong>可操作的设计样稿</strong><br>使用虚构示例；内容仅保留在本页内存，刷新即重置。照片、录音与位置以示意呈现，不调用设备。此原型覆盖首版主要流程，视觉与控件待评审。</div>
  <button class="reset" id="reset">重置示例</button>
</aside>
<div class="mobile-note">Folio 交互样稿 · 示例数据 · 刷新重置 · 媒体与定位为模拟</div>
<section class="phone" aria-label="Folio 手机原型">
  <div class="status-bar"><span>9:41</span><span aria-hidden="true">▂▄▆　▰</span></div>
  <header id="header"></header>
  <main id="screen"></main>
  <div id="bottom"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="sheet"><div id="sheet-content"></div></dialog>
</section>
<script src="prototype.js"></script>
</body>
</html>
